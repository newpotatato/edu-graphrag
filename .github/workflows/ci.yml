name: CI

on:
  push:
    # main and release tags are handled by the CD workflow, which runs this one first.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: mypy (strict)
        run: uv run mypy

  hygiene:
    name: Pre-commit hygiene hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Catches commits made with --no-verify. Ruff and mypy have their own jobs above.
      - name: pre-commit run --all-files
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    # Disposable credentials for throwaway service containers that live only inside this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edu_graphrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edu -d edu_graphrag"
          --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 20s
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: edu_graphrag
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-password
      # A freshly started Neo4j answers its first query slowly (JVM warm-up).
      HEALTH_CHECK_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Unit + integration tests (fails below the coverage threshold)
        run: uv run pytest --integration --cov-report=xml --junitxml=junit.xml
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
