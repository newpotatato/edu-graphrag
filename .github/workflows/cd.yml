name: CD

# When an image is published and how it is tagged:
#   push to main          -> :main, :sha-<short>     (every accepted change, traceable to a commit)
#   push tag vX.Y.Z       -> :X.Y.Z, :X.Y, :X, :latest (explicit release; :X is skipped for 0.x)
#   manual run            -> same as the branch/tag it is started from
# Branches and pull requests never publish: they only run CI.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & push image
    needs: ci  # nothing is published unless every CI job is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # lets the short-lived GITHUB_TOKEN push to GHCR, no stored secrets
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.18"

      - name: Read version from pyproject.toml
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check that the git tag matches the project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in pyproject.toml"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=edu-graphrag
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: edu-graphrag:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name app -p 8000:8000 \
            -e POSTGRES_PASSWORD=unused -e NEO4J_PASSWORD=unused edu-graphrag:ci
          for _ in $(seq 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          echo
          reported=$(curl -fsS localhost:8000/api/v1/version | jq -r .version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::Image reports version '$reported', expected '$VERSION'"
            docker logs app
            exit 1
          fi
          echo "Image reports version $reported"

      - name: Push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Publish summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
