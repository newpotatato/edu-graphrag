global:
  scrape_interval: 5s
  evaluation_interval: 10s
storage:
  tsdb:
    out_of_order_time_window: 30s
scrape_configs:
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
    metric_relabel_configs:
      - source_labels: [__name__, queue]
        regex: "rabbitmq_queue_messages(_ready|_unacked)?;(tasks|tasks.dlq)"
        action: keep
