apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: edu-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    type: loki
    uid: edu-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          datasourceUid: edu-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
  - name: Tempo
    type: tempo
    uid: edu-tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: edu-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{service=~"edu-(api|source|worker)"} | json | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
