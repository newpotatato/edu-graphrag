[project]
name = "edu-graphrag"
version = "0.1.0"
description = "Multimodal GraphRAG aggregator of study materials with course and personal knowledge graphs"
readme = "README.md"
authors = [
    { name = "Kirill", email = "kirill242006@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

# Runtime core lives in [project.dependencies]; everything else is split into
# groups so that each image installs only what it needs (API image: core + web).
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
web = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "neo4j>=6.3.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
# Local `uv sync` installs everything; Docker uses `uv sync --no-dev`.
default-groups = ["web", "dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: errors and warnings
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import order
    "N",        # pep8-naming
    "UP",       # pyupgrade: modern syntax for the target Python version
    "B",        # flake8-bugbear: likely bugs and design problems
    "ASYNC",    # flake8-async: blocking calls inside async functions
    "S",        # flake8-bandit: security issues (hardcoded secrets, etc.)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "ARG",      # unused function arguments
    "PTH",      # prefer pathlib over os.path
    "LOG",      # logging misuse
    "G",        # logging string formatting (use structured fields instead)
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",     # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is the way pytest works
    "S105",     # fake passwords in fixtures
    "S106",
    "ARG",      # fixtures are often requested only for their side effects
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default argument values.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
